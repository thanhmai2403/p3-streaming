# Nguồn DUY NHẤT của mọi tham số (README mục 4). Code không được hard-code các giá trị này.
# Muốn đổi: commit riêng + báo người kia TRƯỚC khi đổi code.
version: 1

kafka:
  bootstrap_internal: "kafka:9092"     # dùng trong mạng docker (Flink/Spark)
  bootstrap_host: "localhost:29092"    # dùng từ máy host (producer, measure)
  topic_in: sensor
  topic_out: alerts
  partitions: 6
  replication_factor: 1
  starting_offsets: earliest
  producer:                            # cấu hình confluent-kafka dùng chung (README mục 8)
    linger.ms: 5
    batch.size: 65536
    acks: "1"
    compression.type: none

detector:
  key: [station_id, param]
  warmup: 24                           # 24 mẫu đầu mỗi key: chỉ cập nhật state
  zscore:
    window: 24
    threshold: 3.0
    min_std: 1.0e-9                    # std quần thể (ddof = 0)
  ewma:
    lambda: 0.3
    L: 3.0
    min_var: 1.0e-9

late:
  tolerance_ms: 7200000                # 2 giờ event-time (README 6.3)

probe:
  every: 100                           # seq % 100 == 0 -> phát thêm 1 bản ghi probe

engine:
  parallelism: 4
  checkpoint_interval_ms: 10000
  state_backend: rocksdb

flink:
  consumer_group: flink-job
  python_execution_mode: thread        # thread (pemja, chạy Python trong JVM) nhanh ~2x so với process
  assign_timestamps: false             # job không dùng timer event-time -> bỏ bước gán timestamp (Python) cho nhanh
  watermark_ms: 10000                  # chỉ dùng khi assign_timestamps: true
  delivery_guarantee: AT_LEAST_ONCE    # RQ3 chạy thêm EXACTLY_ONCE
  transactional_id_prefix: p3-flink
  transaction_timeout_ms: 600000       # phải <= transaction.max.timeout.ms của broker (mặc định 15 phút)
  checkpoint_dir: "file:///checkpoints/flink"

spark:
  shuffle_partitions: 4
  checkpoint_dir: "/checkpoints/spark"

producer:
  seed: 42
  synthetic:                           # dữ liệu tổng hợp cho RQ1/RQ3 (README 7.3)
    n_stations: 1000
    prefix: "syn_"
    param: pm25
    start_value: 50.0

measure:
  warmup_s: 30
  duration_s: 180
  sustain_p99_ms: 1000                 # thông lượng bền vững: p99 < 1000 ms
  sustain_drift_ratio: 1.5             # và trung vị 30 s cuối <= 1.5 x trung vị 30 s đầu
  drift_window_s: 30
  recovery_window_s: 5                 # RQ3: cửa sổ 5 s
  recovery_factor: 2.0                 # RQ3: p99 về dưới 2 x p99 trước khi kill
  recovery_baseline_s: 30              # p99 "trước khi kill" tính trên 30 s ngay trước kill

sota:
  calib_fraction: 0.2                  # ngưỡng = phân vị 99% điểm số trên 20% dữ liệu đầu (không dùng nhãn)
  threshold_quantile: 0.99
  mp:
    m: 24
    normalize: true                    # z-normalized (chuẩn của Yeh et al. 2016); chạy thêm --no-normalize làm ablation
    refractory: 24                     # sau 1 alert bỏ qua m mẫu: 1 discord làm m đoạn con liên tiếp có điểm cao
