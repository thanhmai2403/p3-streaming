# Docker Compose cho Spark (Thành viên B).
# - spark-master  : điều phối + chạy DRIVER (job.py được docker exec vào master)
# - spark-worker-1: 2 core, 4 GB
# - spark-worker-2: 2 core, 4 GB
#   => tổng tài nguyên đúng 4 core + 8 GB (README mục 4).
#
# Kafka/ZooKeeper thuộc phần của Thành viên A (README mục 9): chạy compose của A
# TRƯỚC rồi `docker network connect p3-net kafka` (hoặc để A dùng chung network
# p3-net) để job trong mạng này thấy broker `kafka:9092`.
#
# Ghi chú vận hành:
# - ./checkpoints bind-mount trên CẢ 3 container để driver + executor dùng chung
#   thư mục checkpoint (file:///checkpoints/spark/<run_id>).
# - Nạp job: docker exec spark-master python /opt/p3/spark_job/job.py \
#     --run-id <id> --master spark://spark-master:7077 --bootstrap-servers kafka:9092
# - Kết nối Kafka connector lúc submit qua --packages (P3_SPARK_PACKAGES có sẵn
#   trong image); driver tải từ Maven Central một lần rồi phân phối cho executors.
# - RQ3: docker compose stop spark-worker-1 (giây 60) rồi start lại (giây 70);
#   driver tự replay từ checkpoint.

services:
  spark-master:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    image: p3-spark:4.1.3
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
    ports:
      - "7077:7077"   # master RPC (driver kết nối từ... master container, giữ cho debug)
      - "8080:8080"   # master Web UI (xem application RUNNING)
      - "4040:4040"   # Spark UI của driver
    volumes:
      - ./checkpoints:/checkpoints
      - ./results:/results
    networks:
      - p3-net

  spark-worker-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    image: p3-spark:4.1.3
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4g
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
    ports:
      - "8081:8081"   # worker 1 Web UI
    volumes:
      - ./checkpoints:/checkpoints
    networks:
      - p3-net

  spark-worker-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    image: p3-spark:4.1.3
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4g
      - SPARK_WORKER_WEBUI_PORT=8082
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
    ports:
      - "8082:8082"   # worker 2 Web UI
    volumes:
      - ./checkpoints:/checkpoints
    networks:
      - p3-net

networks:
  p3-net:
    name: p3-net
    driver: bridge
