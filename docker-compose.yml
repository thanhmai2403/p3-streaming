# P3: Kafka (KRaft, 1 broker) + Flink (1 JobManager, 2 TaskManager x 2 slot).
# Phần Spark (spark-master, spark-worker x2) do B thêm vào cuối file.
# Tài nguyên engine (README mục 4): TaskManager 2 x (2 core, 3.5 GB) = 4 core cho xử lý.
# JobManager (điều phối) để riêng 0.5 core / 1 GB -> Spark master phải để y hệt cho công bằng.
# MỖI LẦN CHỈ BẬT MỘT ENGINE.

name: p3

x-flink: &flink
  build:
    context: .
    dockerfile: docker/Dockerfile.flink
  image: p3-flink:2.2.1
  volumes:
    - ./:/opt/p3:ro
    - flink-checkpoints:/checkpoints
  depends_on:
    kafka:
      condition: service_healthy
  environment:
    PYTHONPATH: /opt/p3
    P3_CONFIG: /opt/p3/config.yaml
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: flink-jobmanager
      taskmanager.numberOfTaskSlots: 2
      parallelism.default: 4
      jobmanager.memory.process.size: 1024m
      taskmanager.memory.process.size: 3072m
      state.backend.type: rocksdb
      execution.checkpointing.dir: file:///checkpoints/flink
      restart-strategy.type: fixed-delay
      restart-strategy.fixed-delay.attempts: 1000
      restart-strategy.fixed-delay.delay: 2 s
      python.executable: /usr/local/bin/python3
      python.client.executable: /usr/local/bin/python3
      python.execution-mode: thread
      classloader.parent-first-patterns.additional: pemja.

# Spark dùng chung build + volume cho master và 2 worker (phần của B).
# Mount ./:/opt/p3:ro để sửa code/config không phải build lại (giống Flink).
x-spark: &spark
  build:
    context: .
    dockerfile: docker/Dockerfile.spark
  image: p3-spark:4.1.3
  volumes:
    - ./:/opt/p3:ro
    - spark-checkpoints:/checkpoints

services:
  kafka:
    image: apache/kafka:4.2.2
    container_name: kafka
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 1 broker -> mọi topic nội bộ phải RF = 1 (nếu không, consumer group / transaction sẽ treo)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"
    cpus: 2
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  flink-jobmanager:
    <<: *flink
    container_name: flink-jm
    hostname: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    cpus: 0.5
    mem_limit: 1200m

  # Hai TaskManager đặt tên riêng để RQ3 kill đúng 1 container (docker kill flink-tm1).
  flink-taskmanager-1:
    <<: *flink
    container_name: flink-tm1
    command: taskmanager
    depends_on: [flink-jobmanager]
    cpus: 2
    mem_limit: 3500m

  flink-taskmanager-2:
    <<: *flink
    container_name: flink-tm2
    command: taskmanager
    depends_on: [flink-jobmanager]
    cpus: 2
    mem_limit: 3500m

  # ---------------- Spark (Thành viên B) ----------------
  # Tài nguyên đặt Y HỆT phía Flink để so sánh công bằng (README mục 4):
  #   spark-master = flink-jobmanager (0,5 core / 1,2 GB) - điều phối + chạy driver
  #   spark-worker = flink-taskmanager (2 core / 3,5 GB mỗi cái) -> tổng 4 core xử lý
  # MỖI LẦN CHỈ BẬT MỘT ENGINE (worker-1 dùng cổng UI 8081 trùng flink-jm).
  # Giới hạn RAM của worker để 3072m cho JVM, phần còn lại cho Python worker (pandas UDF).
  # LƯU Ý: image apache/spark:4.1.3 có ENTRYPOINT=/opt/entrypoint.sh và CMD=null; entrypoint chỉ xử lý
  # riêng 'driver'/'executor', mọi lệnh khác rơi vào nhánh `*) exec "$@"` (pass-through). Thiếu `command`
  # -> entrypoint exec rỗng -> container exit 0 ngay, cluster không bao giờ lên. Vì vậy mỗi service
  # phải khai báo tường minh daemon chạy FOREGROUND qua spark-class (không daemonize, không cần sbin/).
  # Heap của chính daemon/master vẫn lấy từ SPARK_DAEMON_MEMORY (SparkClassCommandBuilder đọc env này).
  spark-master:
    <<: *spark
    container_name: spark-master
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      P3_CONFIG: /opt/p3/config.yaml
      PYTHONPATH: /opt/p3
      P3_SPARK_PACKAGES: org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      SPARK_USER: spark
    ports:
      - "7077:7077"   # master RPC (job.py --master spark://spark-master:7077)
      - "8080:8080"   # master Web UI (kiểm tra application RUNNING)
      - "4040:4040"   # Spark UI của driver
    depends_on:
      kafka:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 1200m

  # Đặt tên riêng để RQ3 kill đúng 1 container (docker kill spark-worker-1).
  # Worker chạy foreground qua spark-class; số core và RAM QUẢNG CÁO vẫn lấy từ
  # SPARK_WORKER_CORES / SPARK_WORKER_MEMORY trong `environment` bên dưới (Worker đọc env này).
  spark-worker-1:
    <<: *spark
    container_name: spark-worker-1
    hostname: spark-worker-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8081"
      - spark://spark-master:7077
    environment:
      P3_CONFIG: /opt/p3/config.yaml
      PYTHONPATH: /opt/p3
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 3072m
      SPARK_WORKER_WEBUI_PORT: "8081"
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      SPARK_USER: spark
    ports:
      - "8081:8081"   # worker 1 Web UI
    depends_on: [spark-master]
    cpus: 2
    mem_limit: 3500m

  spark-worker-2:
    <<: *spark
    container_name: spark-worker-2
    hostname: spark-worker-2
    # `--webui-port` ghi đè env SPARK_WORKER_WEBUI_PORT nên phải khớp 8082 (host publish 8082:8082).
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8082"
      - spark://spark-master:7077
    environment:
      P3_CONFIG: /opt/p3/config.yaml
      PYTHONPATH: /opt/p3
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 3072m
      SPARK_WORKER_WEBUI_PORT: "8082"
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      SPARK_USER: spark
    ports:
      - "8082:8082"   # worker 2 Web UI
    depends_on: [spark-master]
    cpus: 2
    mem_limit: 3500m

volumes:
  flink-checkpoints:
  spark-checkpoints:
